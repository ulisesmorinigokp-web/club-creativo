<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Club Creativo</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen font-sans">

    <!-- Header / Navbar -->
    <header class="bg-white border-b border-slate-200 py-4 px-6 flex justify-between items-center shadow-sm">
        <h1 class="text-xl font-bold text-slate-800">Panel Admin - Club Creativo</h1>
        <button id="btn-logout" onclick="cerrarSesion()" class="hidden bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-lg font-semibold text-xs transition-all">
            <i class="fa-solid fa-right-from-bracket mr-2"></i>Cerrar Sesión
        </button>
    </header>

    <main class="p-4 md:p-8 max-w-6xl mx-auto">

        <!-- 1. PANTALLA DE INICIO DE SESIÓN -->
        <section id="seccion-login" class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-lg border border-slate-100 mt-12">
            <h2 class="text-2xl font-bold text-slate-900 text-center mb-2">Iniciar Sesión</h2>
            <p class="text-slate-500 text-center text-xs mb-6">Accede para administrar tus productos</p>
            
            <form onsubmit="iniciarSesion(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1 uppercase">Correo Electrónico</label>
                    <input type="email" id="login-email" required class="w-full border border-slate-300 p-2.5 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1 uppercase">Contraseña</label>
                    <input type="password" id="login-password" required class="w-full border border-slate-300 p-2.5 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition-all text-sm shadow-md">
                    Ingresar
                </button>
            </form>
            <p id="error-login" class="text-red-500 text-xs text-center mt-4 hidden"></p>
        </section>


        <!-- 2. PANEL DE ADMINISTRACIÓN (PROTEGIDO) -->
        <section id="seccion-admin" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- FORMULARIO DE AGREGAR / EDITAR -->
            <div class="bg-white p-6 rounded-2xl shadow-lg border border-slate-100 lg:col-span-1 h-fit">
                <h2 id="titulo-form" class="text-xl font-bold mb-4 text-slate-800 border-b pb-2">Cargar Nuevo Producto</h2>
                
                <form id="form-producto" class="space-y-4">
                    <!-- Campo Oculto para ID (sirve cuando editamos) -->
                    <input type="hidden" id="producto-id">

                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Nombre del Producto</label>
                        <input type="text" id="nombre" required placeholder="Ej: Remera Bordada" class="w-full border border-slate-300 p-2.5 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Categoría</label>
                        <select id="categoria" class="w-full border border-slate-300 p-2.5 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="remeras">Remeras</option>
                            <option value="hoodies">Hoodies</option>
                            <option value="peluches">Peluches</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Descripción</label>
                        <textarea id="descripcion" rows="3" placeholder="Detalles del producto..." class="w-full border border-slate-300 p-2.5 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Imágenes <span id="nota-fotos" class="text-[10px] text-slate-400 font-normal">(Obligatorio en nuevos)</span></label>
                        <input type="file" id="fotos" multiple accept="image/*" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                    </div>

                    <button type="submit" id="btn-guardar" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition-all text-sm shadow-md">
                        Guardar y Publicar
                    </button>
                    
                    <button type="button" id="btn-cancelar" onclick="resetearFormulario()" class="hidden w-full bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-2 rounded-xl transition-all text-xs">
                        Cancelar Edición
                    </button>
                </form>
            </div>

            <!-- TABLA Y LISTA DE PRODUCTOS -->
            <div class="bg-white p-6 rounded-2xl shadow-lg border border-slate-100 lg:col-span-2">
                <div class="flex justify-between items-center mb-4 border-b pb-2">
                    <h2 class="text-xl font-bold text-slate-800">Catálogo Actual</h2>
                    <span id="total-productos" class="text-xs bg-blue-100 text-blue-700 font-bold px-2.5 py-1 rounded-full">0 productos</span>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm text-slate-600">
                        <thead class="bg-slate-50 text-slate-700 text-xs uppercase font-bold border-b">
                            <tr>
                                <th class="p-3">Imagen</th>
                                <th class="p-3">Producto</th>
                                <th class="p-3">Categoría</th>
                                <th class="p-3 text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-productos-body">
                            <!-- Filas dinámicas -->
                        </tbody>
                    </table>
                </div>
            </div>

        </section>
    </main>

    <script>
        // Configuración Supabase
        const SUPABASE_URL = 'https://vfrnuhqtxabuitshzqmw.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Er4MAkpCzjPgyZIjAVwrPg_OTuPQuvD';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let productosGlobales = [];

        // --- 1. GESTIÓN DE SESIÓN Y LOGIN ---
        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            evaluarSesion(session);
        });

        function evaluarSesion(session) {
            const secLogin = document.getElementById('seccion-login');
            const secAdmin = document.getElementById('seccion-admin');
            const btnLogout = document.getElementById('btn-logout');

            if (session) {
                secLogin.classList.add('hidden');
                secAdmin.classList.remove('hidden');
                btnLogout.classList.remove('hidden');
                cargarProductosAdmin();
            } else {
                secLogin.classList.remove('hidden');
                secAdmin.classList.add('hidden');
                btnLogout.classList.add('hidden');
            }
        }

        async function iniciarSesion(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const errorEl = document.getElementById('error-login');

            errorEl.classList.add('hidden');

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (error) {
                errorEl.textContent = "Credenciales incorrectas o usuario no registrado.";
                errorEl.classList.remove('hidden');
            } else {
                evaluarSesion(data.session);
            }
        }

        async function cerrarSesion() {
            await supabaseClient.auth.signOut();
            evaluarSesion(null);
        }


        // --- 2. CARGAR Y RENDEREAR PRODUCTOS ---
        async function cargarProductosAdmin() {
            const tbody = document.getElementById('tabla-productos-body');
            tbody.innerHTML = `<tr><td colspan="4" class="text-center p-6 text-slate-400">Cargando productos...</td></tr>`;

            const { data, error } = await supabaseClient
                .from('productos')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error('Error:', error);
                tbody.innerHTML = `<tr><td colspan="4" class="text-center p-6 text-red-500">Error al obtener catálogo.</td></tr>`;
                return;
            }

            productosGlobales = data || [];
            document.getElementById('total-productos').textContent = `${productosGlobales.length} productos`;

            if (productosGlobales.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center p-6 text-slate-400">No hay productos guardados.</td></tr>`;
                return;
            }

            tbody.innerHTML = productosGlobales.map((p, index) => {
                let foto = 'https://via.placeholder.com/150';
                if (Array.isArray(p.imagenes) && p.imagenes.length > 0) foto = p.imagenes[0];
                else if (Array.isArray(p.imagen) && p.imagen.length > 0) foto = p.imagen[0];
                else if (p.imagen) foto = p.imagen;

                return `
                <tr class="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                    <td class="p-3">
                        <img src="${foto}" alt="${p.nombre || ''}" class="w-12 h-12 object-cover rounded-lg border">
                    </td>
                    <td class="p-3">
                        <div class="font-bold text-slate-800">${p.nombre || 'Sin nombre'}</div>
                        <div class="text-xs text-slate-400 truncate max-w-xs">${p.descripcion || ''}</div>
                    </td>
                    <td class="p-3">
                        <span class="bg-blue-50 text-blue-700 px-2 py-1 rounded-md text-xs font-semibold capitalize">${p.categoria || 'Gral'}</span>
                    </td>
                    <td class="p-3 text-center space-x-1">
                        <button type="button" onclick="prepararEdicionPorIndice(${index})" title="Modificar" class="bg-amber-50 hover:bg-amber-500 text-amber-600 hover:text-white px-2.5 py-1.5 rounded-lg text-xs font-bold transition-all">
                            <i class="fa-solid fa-pen"></i>
                        </button>
                        <button type="button" onclick="eliminarProductoPorIndice(${index})" title="Eliminar" class="bg-red-50 hover:bg-red-600 text-red-600 hover:text-white px-2.5 py-1.5 rounded-lg text-xs font-bold transition-all">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </td>
                </tr>
                `;
            }).join('');
        }


        // --- 3. GUARDAR (CREAR O MODIFICAR PRODUCTO) ---
        const form = document.getElementById('form-producto');
        const btn = document.getElementById('btn-guardar');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            btn.disabled = true;

            try {
                const idProd = document.getElementById('producto-id').value;
                const nombre = document.getElementById('nombre').value;
                const categoria = document.getElementById('categoria').value;
                const descripcion = document.getElementById('descripcion').value;
                const archivos = document.getElementById('fotos').files;

                let URLs = [];

                // Si se seleccionaron nuevas imágenes, se suben a Storage 'galeria'
                if (archivos.length > 0) {
                    btn.innerText = 'Subiendo imágenes...';
                    for (let file of archivos) {
                        const nombreLimpio = file.name.replace(/[^a-zA-Z0-9.-]/g, '_');
                        const nombreArchivo = `${Date.now()}-${nombreLimpio}`;
                        
                        const { error } = await supabaseClient.storage
                            .from('galeria')
                            .upload(nombreArchivo, file);

                        if (error) throw error;

                        const { data: urlData } = supabaseClient.storage
                            .from('galeria')
                            .getPublicUrl(nombreArchivo);

                        URLs.push(urlData.publicUrl);
                    }
                }

                btn.innerText = 'Guardando producto...';

                if (idProd) {
                    // --- MODO MODIFICAR ---
                    const datosActualizar = { nombre, categoria, descripcion };
                    // Solo actualiza las imágenes si el usuario seleccionó nuevas
                    if (URLs.length > 0) datosActualizar.imagenes = URLs;

                    const { error } = await supabaseClient
                        .from('productos')
                        .update(datosActualizar)
                        .eq('id', idProd);

                    if (error) throw error;
                    alert('¡Producto modificado con éxito!');

                } else {
                    // --- MODO CREAR NUEVO ---
                    if (URLs.length === 0) {
                        alert('Por favor selecciona al menos una imagen para el nuevo producto.');
                        btn.disabled = false;
                        btn.innerText = 'Guardar y Publicar';
                        return;
                    }

                    const { error } = await supabaseClient
                        .from('productos')
                        .insert([{ nombre, categoria, descripcion, imagenes: URLs }]);

                    if (error) throw error;
                    alert('¡Producto publicado con éxito!');
                }

                resetearFormulario();
                cargarProductosAdmin();

            } catch (err) {
                alert('Error al procesar: ' + err.message);
                console.error(err);
            } finally {
                btn.disabled = false;
                btn.innerText = document.getElementById('producto-id').value ? 'Actualizar Producto' : 'Guardar y Publicar';
            }
        });


        // --- 4. PREPARAR FORMULARIO PARA EDITAR ---
        function prepararEdicionPorIndice(index) {
            const prod = productosGlobales[index];
            if (!prod) return;

            document.getElementById('producto-id').value = prod.id;
            document.getElementById('nombre').value = prod.nombre || '';
            document.getElementById('categoria').value = (prod.categoria || 'remeras').toLowerCase();
            document.getElementById('descripcion').value = prod.descripcion || '';

            document.getElementById('titulo-form').textContent = 'Modificar Producto';
            document.getElementById('btn-guardar').textContent = 'Actualizar Producto';
            document.getElementById('btn-cancelar').classList.remove('hidden');
            
            // Al editar no exigimos que vuelva a subir fotos obligatoriamente
            document.getElementById('fotos').required = false;

            // Desplazar suavemente hasta el formulario
            form.scrollIntoView({ behavior: 'smooth' });
        }

        function resetearFormulario() {
            form.reset();
            document.getElementById('producto-id').value = '';
            document.getElementById('titulo-form').textContent = 'Cargar Nuevo Producto';
            document.getElementById('btn-guardar').textContent = 'Guardar y Publicar';
            document.getElementById('btn-cancelar').classList.add('hidden');
            document.getElementById('fotos').required = true;
        }


        // --- 5. ELIMINAR PRODUCTO ---
        async function eliminarProductoPorIndice(index) {
            const prod = productosGlobales[index];
            if (!prod) return;

            const confirmacion = confirm(`¿Estás seguro de que deseas eliminar "${prod.nombre}"?`);
            if (!confirmacion) return;

            try {
                const { error } = await supabaseClient
                    .from('productos')
                    .delete()
                    .eq('id', prod.id);

                if (error) throw error;

                alert(`"${prod.nombre}" eliminado correctamente.`);
                
                // Si justo estábamos editando este producto, cancelamos la edición
                if (document.getElementById('producto-id').value == prod.id) {
                    resetearFormulario();
                }

                cargarProductosAdmin();
            } catch (err) {
                alert('Error al eliminar: ' + err.message);
            }
        }
    </script>
</body>
</html>
